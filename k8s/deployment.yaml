
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-project
  template:
    metadata:
      labels:
        app: my-project
    spec:
      containers:
        - name: my-project
          image: prxo/my-project:10
          ports:
            - containerPort: 5000

